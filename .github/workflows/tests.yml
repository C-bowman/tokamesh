name: tests

on:
  push:
    paths:
      - '**.py'
      - '**.toml'
      - '**.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.toml'
      - '**.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build triangle for Python 3.14
      if: matrix.python-version == '3.14'
      # PyPI has no Python 3.14 wheel or sdist for triangle 20250106.
      # Build that release from its pinned upstream commit instead.
      run: python -m pip install "triangle @ git+https://github.com/drufat/triangle.git@595b43eb6682992a0b1012b9671bf860c0e6ae56"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[tests]
    - name: Test with pytest
      run: |
        pytest -v --cov=tokamesh
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package
        run: python -m build --sdist --wheel
      - name: Check build
        run: twine check dist/*